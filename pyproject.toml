[project]
name = "stock-ml"
version = "0.1.0"
description = "Making Stock investing ML"
authors = [
    { name = "Juwon Lee", email = "juwonlee3465@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
    # === CORE ML / PREPROCESSING ===
    "numpy ==1.26.4",                     # TensorFlow + PyTorch 모두 호환
    "scikit-learn >=1.3,<1.5",
    "tensorflow == 2.14.0",                  # MPS 안정 버전
    "protobuf == 4.25.3",                     # TensorFlow + PyTorch 모두 호환
    "torch >=2.2,<2.3",                   # MPS 안정 버전
    "transformers >=4.57,<5.0",

    # === DATA / I/O / DATABASE ===
    "yfinance >=0.2.66,<0.3.0",
    "fredapi >=0.5.2,<0.6.0",
    "pyyaml >=6.0.3,<7.0.0",
    "matplotlib >=3.8,<3.9",              # TF + PyTorch 충돌 방지
    "duckdb ==1.4.1",

    # === WEB / STREAMLIT ===
    "streamlit >=1.31,<1.52",

    # === FIXED — CRASH PREVENTION ===
    "pyarrow ==14.0.2",                   # 반드시 고정 — Arrow ABI 안정 버전
    "protobuf ==4.25.3",                  # Torch / TF / Arrow 모두 호환

    # === NLP / PARSING ===
    "textblob >=0.19,<0.20",
    "lxml >=6.0.2,<7.0.0",
    "html5lib >=1.1,<2.0",
    "beautifulsoup4 >=4.14,<5.0",
    "opendartreader >=0.2.3,<0.3.0",

    # === UTILS ===
    "dotenv >=0.9.9,<0.10.0",
    "accelerate (>=1.12.0,<2.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "anthropic (>=1.2.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel >=7.1,<8.0"
]

[tool.poetry]
package-mode = false

